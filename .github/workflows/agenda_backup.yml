name: 🔄 Agenda de Backups do Integra

on:
  schedule:
    # 07h00 no Brasil
    - cron: '0 10 * * *'
    
    # 09h30, 12h30 e 16h30 no Brasil
    - cron: '30 12,15,19 * * *'
    
  workflow_dispatch: # Botão manual

jobs:
  fazer-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder aos ficheiros do projeto
        uses: actions/checkout@v3

      - name: Preparar o ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar ferramentas necessárias
        run: |
          pip install -r requirements.txt
          pip install supabase

      - name: 🛡️ Entregar e Validar as Chaves pelo Python
        env:
          MEUS_SEGREDOS: ${{ secrets.SEGREDOS_DO_APP }}
        run: |
          python -c "
          import os, sys, tomllib
          
          conteudo = os.environ.get('MEUS_SEGREDOS', '')
          if not conteudo.strip():
              print('🔴 ERRO CRÍTICO: O segredo está vazio no GitHub!')
              sys.exit(1)
              
          try:
              # O Python vai testar a leitura do ficheiro antes de o guardar
              tomllib.loads(conteudo)
              print('✅ Texto formatado corretamente! A guardar no cofre...')
          except Exception as e:
              print(f'🔴 ERRO NA FORMATAÇÃO DO TEXTO: {e}')
              print(f'O texto secreto que está no GitHub começa com: {conteudo[:10]}...')
              sys.exit(1)
              
          os.makedirs('.streamlit', exist_ok=True)
          with open('.streamlit/secrets.toml', 'w', encoding='utf-8') as f:
              f.write(conteudo)
          "

      - name: 🚀 Executar a rotina de backup
        run: python rotina_backup.py
