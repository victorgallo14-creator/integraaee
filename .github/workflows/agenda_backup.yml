name: 🔄 Agenda de Backups do Integra

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '30 12,15,19 * * *'
  workflow_dispatch: 

jobs:
  fazer-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder aos ficheiros
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ferramentas
        run: |
          pip install pandas supabase streamlit st-gsheets-connection gspread

      - name: 🛡️ Criar e Limpar Secrets
        env:
          MEUS_SEGREDOS: ${{ secrets.SEGREDOS_DO_APP }}
        run: |
          python -c "
          import os
          conteudo = os.environ.get('MEUS_SEGREDOS', '')
          os.makedirs('.streamlit', exist_ok=True)
          # O .strip() remove qualquer sujeira (ponto, espaço) no início/fim
          with open('.streamlit/secrets.toml', 'w', encoding='utf-8') as f:
              f.write(conteudo.strip())
          "

      - name: 🚀 Executar Backup
        run: python rotina_backup.py
